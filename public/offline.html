<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>دفترچه تلفن</title>
    <style>
      :root {
        --page: #f3fafc;
        --card: #ffffff;
        --ink: #3e4a5e;
        --ink2: #56627a;
        --mint: #daf4ea;
        --mint-t: #3e9c7c;
        --button: linear-gradient(180deg, #93cde2, #68aecb);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #161c27;
          --card: #181f2b;
          --ink: #eaf0f6;
          --ink2: #8c97ac;
          --mint: #1e3b33;
          --mint-t: #7fe0bc;
        }
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
        background: var(--page);
        color: var(--ink);
        font-family: Vazirmatn, Tahoma, sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
        padding: 32px 24px;
        border-radius: 28px;
        background: var(--card);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 18px;
        background: var(--mint);
        color: var(--mint-t);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 20px;
        color: var(--ink2);
        font-size: 14px;
        line-height: 1.9;
      }
      button {
        padding: 12px 28px;
        border: 0;
        border-radius: 999px;
        background: var(--button);
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="logo" aria-hidden="true">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 20V5a2 2 0 0 1 2-2h13v17H7a2 2 0 0 0-2 2" />
          <path d="M9 7h7M9 11h5" />
        </svg>
      </span>
      <h1>اتصال اینترنت نداری</h1>
      <p>
        این صفحه هنوز روی این دستگاه ذخیره نشده. وقتی دوباره وصل شدی، امتحان کن؛
        فهرست مخاطب‌هایی که قبلاً دیدی بدون اینترنت هم باز می‌شه.
      </p>
      <button type="button" onclick="location.reload()">
        دوباره امتحان کن
      </button>
    </main>
  </body>
</html>
